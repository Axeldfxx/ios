name: Build APK

on:
  workflow_dispatch:   # bisa dijalankan manual dari tab Actions (HP juga bisa)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # repo tidak punya skrip gradlew, jadi versinya disamakan dengan gradle-wrapper.properties
          gradle-version: 9.7.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle assembleAospWithoutQuickstepDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: murine-launcher-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
